# GitHub Pages deployment workflow
# Builds Sphinx docs and deploys the full site (project page + docs) to GitHub Pages.
#
# Trigger: push to gh-pages branch. Can also be run manually.

name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true
          pip install sphinx pydata-sphinx-theme sphinx-autodoc-typehints sphinx-copybutton

      - name: Build Sphinx docs
        run: |
          cd _sphinx_src
          python -m sphinx -b html . ../docs

      - name: Assemble site
        run: |
          mkdir -p _site
          # Copy the project page
          cp index.html _site/
          cp -r static _site/ 2>/dev/null || true
          cp .nojekyll _site/
          # Copy Sphinx docs
          cp -r docs _site/docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
